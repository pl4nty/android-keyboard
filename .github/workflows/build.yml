name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git lfs install && git submodule update --init --recursive --depth 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Signing
        if: env.KEYSTORE_FILE != ''
        run: |
          echo "$KEYSTORE_FILE" | base64 --decode > key.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=key.jks\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEYSTORE_ALIAS" > keystore.properties

      - name: Version
        run: |
          echo "VERSION_CODE=$(git rev-list --first-parent --count HEAD)" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(git describe --tags --always)-reactions.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=${{ github.head_ref || github.ref_name }}" >> "$GITHUB_ENV"

      - run: ./gradlew assembleUnstableRelease -s

      - run: mv build/outputs/apk/unstable/release/*.apk "futo-keyboard-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: futo-keyboard-${{ env.VERSION_NAME }}
          path: "*.apk"

      - if: github.event_name == 'push' || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: "*.apk"
